services:
  postgres:
    image: ${MCB_IMAGE_PREFIX:?set MCB_IMAGE_PREFIX in deploy/compose/.env}/postgres:${MCB_IMAGE_TAG:?set MCB_IMAGE_TAG in deploy/compose/.env}
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.postgres

  web:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.web
      target: web

  api:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.bun-service
      target: api

  agent-gateway:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.bun-service
      target: agent-gateway

  nano-brain:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.bun-service
      target: nano-brain

  traditional-rag:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.python-service
      target: traditional-rag

  graph-rag:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.python-service
      target: graph-rag

  neo4j:
    build:
      context: ../database/neo4j

  migrate:
    build:
      context: ../..
      dockerfile: deploy/database/Dockerfile.migrate
